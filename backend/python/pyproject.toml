[project]
name = "ai-resume-forge-python"
version = "0.1.0"
description = "AI Resume Forge Python backend with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=1.0.0",
    "langchain-core>=1.3.0",
    "langchain-community>=0.4.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langchain-openai>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.66",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    # 桌面端安装包要把 Python 运行时打成独立 exe（scripts/build_desktop_bundle.py）
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "agent"]
module-root = "src"
source-exclude = ["src/**/.omc", "src/**/.omc/**", "src/**/__pycache__", "src/**/__pycache__/**", "src/**/*.pyc"]
wheel-exclude = ["app/**/.omc", "app/**/.omc/**", "app/**/__pycache__", "app/**/__pycache__/**", "app/**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
