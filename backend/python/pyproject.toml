[project]
name = "ai-resume-forge-python"
version = "0.1.0"
description = "AI Resume Forge Python backend with FastAPI and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=1.0.0",
    "langchain-core>=1.3.0",
    "langchain-community>=0.4.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langchain-openai>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.66",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
