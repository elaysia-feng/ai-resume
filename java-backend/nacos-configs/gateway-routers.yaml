routes:
  - id: auth-service
    uri: lb://auth-service
    predicates:
      - Path=/api/auth/**

  - id: resume-service
    uri: lb://resume-service
    predicates:
      - Path=/api/resumes/**

  - id: agent-service
    uri: lb://agent-service
    predicates:
      - Path=/api/agent/**

  - id: interview-service
    uri: lb://interview-service
    predicates:
      - Path=/api/interview/**

  - id: order-service
    uri: lb://order-service
    predicates:
      - Path=/api/orders/**,/api/plans/**,/api/subscriptions/**

  - id: payment-service
    uri: lb://payment-service
    predicates:
      - Path=/api/pay/**

  - id: notification-service
    uri: lb://notification-service
    predicates:
      - Path=/api/notification/**
